[package]
name = "amd-intertouch"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
repository = "https://github.com/meetox80/amd-intertouch"
description = "Synaptics InterTouch (RMI4 over SMBus) on AMD ThinkPads through the FCH ASF Host Notify path"
readme = "README.md"
build = "build.rs"
include = ["src/**", "dkms/**", "tests/**", "packaging/**", "build.rs", "LICENSE", "README.md"]

[lib]
name = "amd_intertouch"
path = "src/lib.rs"

[[bin]]
name = "amd-intertouch"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
