PACKAGE_NAME="amd-intertouch"
PACKAGE_VERSION="0.1.0"
PRE_BUILD="tools/pre-build.sh ${kernelver}"
PATCH[0]="0001-i2c-piix4-listen-for-Host-Notify-on-the-SMB0001-port.patch"
PATCH[1]="0002-Input-rmi4-wait-after-the-resume-reset.patch"
PATCH[2]="0003-Input-synaptics-60-ms-doze-for-some-Lenovo-pads.patch"
PATCH[3]="0004-Input-synaptics-add-LEN2073-to-the-SMBus-list.patch"
PATCH[4]="0005-Input-synaptics-keep-the-RMI4-sensor-awake-on-the-ThinkPad-T14-P14s-Gen-1-AMD.patch"
PATCH[5]="backports/0101-Input-psmouse-fix-use-after-free-during-protocol-disconnect.patch"
PATCH[6]="backports/0102-Input-focaltech-use-signed-coordinates-to-prevent-underflow.patch"
MAKE[0]="make -C /usr/lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILT_MODULE_NAME[0]="i2c-piix4"
BUILT_MODULE_LOCATION[0]="drivers/i2c/busses/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="rmi_smbus"
BUILT_MODULE_LOCATION[1]="drivers/input/rmi4/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="psmouse"
BUILT_MODULE_LOCATION[2]="drivers/input/mouse/"
DEST_MODULE_LOCATION[2]="/updates"
AUTOINSTALL="yes"
